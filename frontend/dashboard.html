<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — SESAS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/theme.js"></script>
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>

  <div class="main">
    <div id="topbar-mount"></div>

    <div class="main-content">
      <div id="statCards" class="card-grid"></div>

      <div id="quickActions" class="quick-actions"></div>

      <div class="dash-grid">
        <div class="panel fade-up">
          <div class="panel-head">
            <div><h3>Upcoming Exams</h3><p>Scheduled examinations across all departments</p></div>
            <a href="create-exam.html" class="btn btn-outline btn-sm">+ New Exam</a>
          </div>
          <div id="examList"></div>
        </div>

        <div style="display:flex; flex-direction:column; gap:20px;">
          <div class="panel fade-up fade-up-1">
            <div class="panel-head"><div><h3>Room Occupancy</h3><p>From last generated arrangement</p></div></div>
            <div id="roomMini" class="room-mini"></div>
          </div>

          <div class="panel fade-up fade-up-2">
            <div class="panel-head"><div><h3>Recent Activity</h3></div></div>
            <div id="activityFeed"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  requireAuth();
  window.ACTIVE_PAGE = 'dashboard';
  window.PAGE_TITLE = 'Dashboard';
  window.PAGE_EYEBROW = 'Overview';
</script>
<script src="components/sidebar.js"></script>
<script src="components/navbar.js"></script>
<script src="components/cards.js"></script>
<script src="components/modal.js"></script>
<script src="js/seating.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
