<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Database — SESAS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/theme.js"></script>
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>

  <div class="main">
    <div id="topbar-mount"></div>

    <div class="main-content">
      <div class="panel fade-up">
        <div class="panel-head">
          <div><h3>Student Database</h3><p id="studentCount" class="text-sm text-soft">— students</p></div>
          <div class="flex gap-8">
            <button class="btn btn-outline btn-sm" id="exportBtn">Export CSV</button>
            <button class="btn btn-outline btn-sm" id="uploadBtn">Upload Excel/CSV</button>
            <button class="btn btn-primary btn-sm" id="addStudentBtn">+ Add Student</button>
          </div>
        </div>

        <div class="flex gap-12 mb-16" style="flex-wrap:wrap;">
          <input type="text" id="studentSearch" placeholder="Search by USN or name…" style="flex:1; min-width:220px; padding:10px 12px; border:1.5px solid var(--line); border-radius:4px; font-size:13.5px;">
          <select id="branchFilter" style="padding:10px 12px; border:1.5px solid var(--line); border-radius:4px; font-size:13.5px;">
            <option value="all">All branches</option>
          </select>
          <button class="btn btn-danger btn-sm" id="clearAllBtn">Clear All</button>
        </div>

        <div class="table-wrap">
          <table id="studentTable">
            <thead><tr><th>USN</th><th>Name</th><th>Branch</th><th>Semester</th><th>Seat</th><th>Actions</th></tr></thead>
            <tbody id="studentTbody"></tbody>
          </table>
        </div>
        <div id="studentEmpty" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  requireAuth();
  window.ACTIVE_PAGE = 'students';
  window.PAGE_TITLE = 'Student Database';
  window.PAGE_EYEBROW = 'Setup';
</script>
<script src="js/seating.js"></script>
<script src="components/sidebar.js"></script>
<script src="components/navbar.js"></script>
<script src="components/cards.js"></script>
<script src="components/modal.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('studentEmpty').innerHTML = emptyState({
      title: 'No students found',
      desc: 'Add a student manually or upload a CSV to populate the database.',
      actionHtml: '<button class="btn btn-primary btn-sm" onclick="openAddStudent()">+ Add Student</button>'
    });
  });
</script>
<script src="js/students.js"></script>
</body>
</html>
