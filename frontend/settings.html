<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — SESAS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/theme.js"></script>
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>

  <div class="main">
    <div id="topbar-mount"></div>

    <div class="main-content" style="max-width:760px;">

      <div class="panel fade-up mb-24">
        <div class="panel-head"><div><h3>College Information</h3><p>Shown on reports, letterheads and the sidebar</p></div></div>
        <form id="collegeForm">
          <div class="field">
            <label>College Name</label>
            <input type="text" id="fCollegeName" required>
          </div>
          <div class="field">
            <label>Address</label>
            <textarea id="fAddress" rows="2"></textarea>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Semester</label>
              <input type="text" id="fSemester" placeholder="Even Semester">
            </div>
            <div class="field">
              <label>Academic Year</label>
              <input type="text" id="fYear" placeholder="2025-26">
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>

      <div class="panel fade-up fade-up-1 mb-24">
        <div class="panel-head"><div><h3>Security</h3><p>Access controls for this exam cell</p></div></div>
        <label class="checkline checked"><input type="checkbox" checked disabled><div><div class="cl-title">Role-based login</div><div class="cl-desc">Admin, Coordinator and Staff see different levels of access.</div></div></label>
        <label class="checkline checked"><input type="checkbox" checked disabled><div><div class="cl-title">Audit logs</div><div class="cl-desc">Every upload, edit and generation is recorded in Recent Activity.</div></div></label>
        <label class="checkline checked"><input type="checkbox" checked disabled><div><div class="cl-title">Data encryption in transit</div><div class="cl-desc">Enforced automatically once connected to the FastAPI backend.</div></div></label>
      </div>

      <div class="panel fade-up fade-up-2">
        <div class="panel-head"><div><h3>Demo Data</h3><p>This frontend runs on data stored in your browser</p></div></div>
        <p class="text-sm text-soft mb-16">Reset restores the original sample students, classrooms and rules. Useful for demos or if things get into a strange state.</p>
        <button class="btn btn-danger" id="resetBtn">Reset Demo Data</button>
      </div>

    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  requireAuth();
  window.ACTIVE_PAGE = 'settings';
  window.PAGE_TITLE = 'Settings';
</script>
<script src="components/sidebar.js"></script>
<script src="components/navbar.js"></script>
<script src="components/modal.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const college = await Api.getCollege();
    document.getElementById('fCollegeName').value = college.name || '';
    document.getElementById('fAddress').value = college.address || '';
    document.getElementById('fSemester').value = college.semester || '';
    document.getElementById('fYear').value = college.year || '';
  });

  document.getElementById('collegeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    await Api.saveCollege({
      name: document.getElementById('fCollegeName').value.trim(),
      address: document.getElementById('fAddress').value.trim(),
      semester: document.getElementById('fSemester').value.trim(),
      year: document.getElementById('fYear').value.trim(),
      logo: ''
    });
    showToast('College information saved', 'success');
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('Reset all demo data? This will restore the original sample dataset.')) {
      Api.resetDemo();
      showToast('Demo data reset', 'success');
      setTimeout(() => window.location.reload(), 600);
    }
  });
</script>
</body>
</html>
