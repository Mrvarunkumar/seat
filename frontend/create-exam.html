<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Exam — SESAS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/theme.js"></script>
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>

  <div class="main">
    <div id="topbar-mount"></div>

    <div class="main-content" style="max-width:920px;">
      <div style="display:grid; grid-template-columns: 1.3fr 1fr; gap:24px; align-items:start;">

        <div class="panel fade-up">
          <div class="panel-head">
            <div><h3>Exam Details</h3><p>Set up a new examination for seating generation</p></div>
          </div>
          <form id="examForm">
            <div class="field">
              <label>Exam Name</label>
              <input type="text" id="fName" placeholder="e.g. Data Structures End Sem" required>
            </div>
            <div class="field-row">
              <div class="field">
                <label>Subject Code</label>
                <input type="text" id="fCode" placeholder="21CS42" required>
              </div>
              <div class="field">
                <label>Semester</label>
                <select id="fSem" required>
                  <option>1</option><option>2</option><option>3</option>
                  <option selected>4</option><option>5</option><option>6</option>
                  <option>7</option><option>8</option>
                </select>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label>Exam Date</label>
                <input type="date" id="fDate" required>
              </div>
              <div class="field">
                <label>Start Time</label>
                <input type="time" id="fTime" value="10:00" required>
              </div>
            </div>
            <div class="field">
              <label>Duration (minutes)</label>
              <input type="number" id="fDuration" value="180" min="30" step="30" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-8">Create Exam &amp; Continue to Rules</button>
          </form>
        </div>

        <div class="panel fade-up fade-up-1">
          <div class="panel-head"><div><h3>Existing Exams</h3></div></div>
          <div id="examListSide" style="display:flex; flex-direction:column; gap:0;"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  requireAuth();
  window.ACTIVE_PAGE = 'create-exam';
  window.PAGE_TITLE = 'Create Exam';
  window.PAGE_EYEBROW = 'Setup';
</script>
<script src="components/sidebar.js"></script>
<script src="components/navbar.js"></script>
<script src="components/cards.js"></script>
<script src="components/modal.js"></script>
<script>
  async function renderSideList() {
    const exams = await Api.getExams();
    document.getElementById('examListSide').innerHTML = exams.length
      ? exams.map(examRow).join('')
      : emptyState({ title: 'No exams yet', desc: 'Create your first exam using the form.' });
  }
  document.addEventListener('DOMContentLoaded', renderSideList);

  document.getElementById('examForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const exam = {
      id: `exam-${Date.now()}`,
      name: document.getElementById('fName').value.trim(),
      subjectCode: document.getElementById('fCode').value.trim(),
      semester: parseInt(document.getElementById('fSem').value, 10),
      date: document.getElementById('fDate').value,
      time: document.getElementById('fTime').value,
      duration: parseInt(document.getElementById('fDuration').value, 10),
    };
    if (!exam.name || !exam.date) { showToast('Fill in the required fields', 'error'); return; }
    await Api.addExam(exam);
    showToast('Exam created', 'success');
    await renderSideList();
    document.getElementById('examForm').reset();
    document.getElementById('fTime').value = '10:00';
    document.getElementById('fDuration').value = 180;
    setTimeout(() => { window.location.href = 'seating-rules.html'; }, 700);
  });
</script>
</body>
</html>
